<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Love Shack Mix Vid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/loveshack.css" />
  </head>
  <body>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>

    <main class="page edit-page">
      <header class="hero">
        <h1>Love Shack Mix Vid</h1>
        <p>Pick a playlist and generate a mixed highlight video from all of its clips.</p>
      </header>

      <section class="controls card">
        <div class="control-row">
          <a class="btn" href="/loveshack">Main</a>
          <a class="btn" href="/loveshack-favorites">Favorites</a>
          <a class="btn" href="/loveshack-edit">Edit</a>
          <button id="refreshMixBtn" class="btn btn-primary" type="button">Refresh</button>
        </div>
      </section>

      <section class="edit-layout">
        <div class="player card edit-panel">
          <h2>Mix Preview</h2>
          <video id="mixPreview" controls preload="metadata"></video>
          <p id="mixStatus" class="status" aria-live="polite">Ready.</p>
        </div>

        <div class="list card edit-panel">
          <h2>Create Mix</h2>
          <form id="mixForm" class="trim-form">
            <label for="mixPlaylistSelect">Playlist</label>
            <select id="mixPlaylistSelect" name="playlistSource" required>
              <option value="">Choose a playlist...</option>
            </select>

            <label>Clip positions to include</label>
            <div class="trim-time-grid">
              <label class="inline-checkbox" for="mixIncludeBegin">
                <input id="mixIncludeBegin" name="includeBegin" type="checkbox" checked />
                Begin
              </label>
              <label class="inline-checkbox" for="mixIncludeMiddle">
                <input id="mixIncludeMiddle" name="includeMiddle" type="checkbox" checked />
                Middle
              </label>
              <label class="inline-checkbox" for="mixIncludeEnd">
                <input id="mixIncludeEnd" name="includeEnd" type="checkbox" checked />
                End
              </label>
            </div>

            <div class="trim-time-grid">
              <div>
                <label for="mixBeginClipLength">Begin clip length</label>
                <input id="mixBeginClipLength" name="beginClipLength" type="text" placeholder="00:00:05" value="00:00:05" />
              </div>
              <div>
                <label for="mixMiddleClipLength">Middle clip length</label>
                <input id="mixMiddleClipLength" name="middleClipLength" type="text" placeholder="00:00:05" value="00:00:05" />
              </div>
              <div>
                <label for="mixEndClipLength">End clip length</label>
                <input id="mixEndClipLength" name="endClipLength" type="text" placeholder="00:00:05" value="00:00:05" />
              </div>
            </div>

            <div class="trim-time-grid">
              <div>
                <label for="mixTotalLength">Total mix length</label>
                <input id="mixTotalLength" name="totalLength" type="text" placeholder="00:02:00" value="00:02:00" />
              </div>
            </div>

            <label for="mixArrangement">Clip order</label>
            <select id="mixArrangement" name="arrangement">
              <option value="linear" selected>Linear (each video's clips play together, in playlist order)</option>
              <option value="mixed">Mixed (beginning clips, then middle clips, then end clips, mixed across videos)</option>
            </select>

            <label class="inline-checkbox" for="mixRandomOrder">
              <input id="mixRandomOrder" name="mixedOrder" type="checkbox" />
              Randomize clip order (mixed order)
            </label>

            <p class="trim-meta">
              Videos too short to trim to the clip length are included in full.
            </p>

            <button class="btn btn-primary" type="submit">Create Mix Video</button>
          </form>
        </div>
      </section>
    </main>

    <script src="/assets/mix-vid.js" defer></script>
  </body>
</html>
